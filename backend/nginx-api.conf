# Merge this location into a server with a configured HTTPS domain.
# Keep proxy access logs disabled: progress contains no recordings, but is private.
location /v1/ {
    proxy_pass http://127.0.0.1:8107;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
    access_log off;
    proxy_read_timeout 15s;
}
